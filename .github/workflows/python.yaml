name: Python Package

on:
  workflow_dispatch:
  push:
    branches:
     - main
    tags:
      - '*'
  pull_request:
    branches:
      - main

jobs:
  build:
    strategy:
      matrix:
        os:
          - { name: "Linux", image: ubuntu-latest, event_name: "${{ github.event_name }}" }
          - { name: "macOS", image: macos-latest, event_name: "${{ github.event_name }}" }
          - { name: "Windows", image: windows-latest, event_name: "${{ github.event_name }}" }

        exclude:
          - os: { name: "Linux", image: ubuntu-latest, event_name: merge_group }
          - os: { name: "macOS", image: macos-latest, event_name: merge_group }
    runs-on: ${{ matrix.os.image }}

    name: Build YAMPFS-Lib and Python Wheel (${{ matrix.os.image }})

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: 'recursive'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install Python packages
        run: python -m pip install --upgrade pip build

      - name: Build YAMS-Lib into proper directory
        run: dotnet publish YAMPFS-LIB -c Release -o mpo_yampfs/yampfs -r {{ matrix.os.name }}

      - name: build
        # Ideally, we'd have PYTHONWARNINGS=error here, but
        # https://github.com/pypa/pip/issues/12243 is causing issues.
        run: python -m build

      - name: Store the packages
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist

  test:
    needs:
      - build

    runs-on: ubuntu-latest
    name: Test Python ${{ matrix.python.version }}
    strategy:
      fail-fast: false
      matrix:
        python:
          - {version: '3.11'}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: remove code outside of wheel
        run: rm -rf am2r_yams
        shell: bash

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python.version }}

      - name: Download all the dists
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Install Python packages
        run: python -m pip install --upgrade pip

      - name: install built wheel
        run: python -m pip install "$(ls dist/*.whl)[test]"
        shell: bash

      - name: run pytest
        run: python -m pytest --cov

      - name: codecov
        uses: codecov/codecov-action@v7

  pypi:
    runs-on: 'ubuntu-latest'
    needs:
      - test

    permissions:
      id-token: write
      
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      
      - name: Publish 📦 to PyPI
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: pypa/gh-action-pypi-publish@release/v1